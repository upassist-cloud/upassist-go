name: Tests & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test Go SDK
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.22', '1.23', '1.24' ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run Tests
        run: go test -v -race ./...

  release:
    name: Build & Release CLI Binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build Binaries
        run: |
          mkdir -p dist
          for OS in linux darwin windows; do
            for ARCH in amd64 arm64; do
              EXT=
              if [ $OS = windows ]; then EXT=.exe; fi
              BIN=dist/upassist-${OS}-${ARCH}${EXT}
              echo Building $BIN...
              GOOS=$OS GOARCH=$ARCH CGO_ENABLED=0 go build -ldflags=-s -w -o $BIN ./cmd/upassist
            done
          done
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
